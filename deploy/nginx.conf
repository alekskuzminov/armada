# HTTP — redirect to HTTPS
server {
    listen 80;
    server_name armadasite.ru www.armadasite.ru;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name armadasite.ru www.armadasite.ru;

    ssl_certificate /etc/letsencrypt/live/armadasite.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armadasite.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files from Next.js
    location /_next/static/ {
        alias /var/www/armada/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public assets
    location /images/ {
        alias /var/www/armada/public/images/;
        expires 30d;
        add_header Cache-Control "public";
    }
}
